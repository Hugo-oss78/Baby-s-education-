<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Titi &amp; Loulou</title>
  <meta name="description" content="Profils, repères de développement, idées d'activités et journal pour accompagner l'éducation de nos enfants.">
  <meta name="theme-color" content="#1b3160">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">

    <button class="icon-btn" data-action="open-settings" aria-label="Sauvegarde et réglages">⚙️</button>

  <main id="view" class="container"></main>

  <nav class="tabbar" aria-label="Onglets">
    <button data-tab="enfants"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M2.5 20c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"/><path d="M13.5 15.2c.9-.8 1.9-1.2 3-1.2 2.5 0 4.5 2.2 4.5 5"/></svg>Enfants</button>

  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/activities.js"></script>
  <script src="js/reperes.js"></script>
  <script src="js/famille-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
